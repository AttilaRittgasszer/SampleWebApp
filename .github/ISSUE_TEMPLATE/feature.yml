name: Feature
description: Plan a small, focused feature.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be built?
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification
      description: How will we verify it works?
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation
      description: Which docs should be updated?
    validations:
      required: false
